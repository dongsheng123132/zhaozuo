[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowcore-learning-demo"
version = "0.1.0"
description = "Windows Shadow Profile learning experiment for Chrome and WPS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
shadowcore-record = "recorder.cli:main"
shadowcore-execute = "executor.cli:main"
zhaozuo = "desktop_app.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["recorder*", "executor*", "shared*", "desktop_app*"]
